name: Build Godot Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.1
  ANDROID_BUILD_TOOLS: 35.0.0
  ANDROID_PLATFORM: android-35
  ANDROID_NDK: 28.1.13356709
  ANDROID_CMAKE: 3.10.2.4988404

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms/${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmdline-tools;latest" \
            "cmake;${ANDROID_CMAKE}" \
            "ndk;${ANDROID_NDK}"

      - name: Download Godot editor and export templates
        shell: bash
        run: |
          curl --fail --location --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"

          curl --fail --location --output export_templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p godot-templates
          unzip -q export_templates.tpz -d godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp godot-templates/templates/* \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${SDK_PATH}"
          EOF

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p build/android
          ./'Godot_v${GODOT_VERSION}-stable_linux.x86_64' \
            --headless \
            --path . \
            --export-debug 'Android' build/android/NekoNightfall-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neko-nightfall-android-debug-${{ github.sha }}
          path: build/android/NekoNightfall-debug.apk
          if-no-files-found: error
